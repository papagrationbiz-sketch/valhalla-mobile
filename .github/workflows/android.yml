name: Android SDK

on:
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "scripts/build_android.sh"
      - "scripts/move_android_so.sh"
      - "src/**"
      - "triplets/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_CLI_CHECKSUM: "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
  ANDROID_CLI_VERSION: "15859902"
  ANDROID_NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.31.5"
  VCPKG_VERSION: "2025.10.17"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  native:
    name: Native (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            task: buildValhallaArm64V8a
            machine: AArch64
          - abi: x86_64
            task: buildValhallaX8664
            machine: X86-64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android tools
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/commandlinetools.zip"
          sdk_root="${RUNNER_TEMP}/android-sdk"
          curl --fail --location --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CLI_VERSION}_latest.zip" \
            --output "$archive"
          echo "${ANDROID_CLI_CHECKSUM}  ${archive}" | sha256sum --check
          mkdir -p "${sdk_root}/cmdline-tools"
          unzip -q "$archive" -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          echo "ANDROID_HOME=${sdk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "$GITHUB_ENV"
          echo "${sdk_root}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;35.0.0" \
            "platforms;android-36" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" >/dev/null

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "${VCPKG_VERSION}"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: android-vcpkg-${{ matrix.abi }}-${{ hashFiles('src/vcpkg.json', 'src/valhalla/vcpkg.json', 'src/valhalla/vcpkg-configuration.json', 'triplets/*-android.cmake') }}

      - name: Build native library
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export VCPKG_ROOT="${RUNNER_TEMP}/vcpkg"
          export PATH="${ANDROID_HOME}/cmake/${CMAKE_VERSION}/bin:${PATH}"
          ./android/gradlew \
            -p android \
            ":valhalla:${{ matrix.task }}" \
            "-PvalhallaAbis=${{ matrix.abi }}" \
            --no-daemon \
            --warning-mode=fail

      - name: Inspect ELF
        env:
          ABI: ${{ matrix.abi }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        shell: bash
        run: |
          library="build/android/${ABI}/wrapper/wrapper/libvalhalla-wrapper.so"
          readelf="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf" -h "$library" | grep -F "$EXPECTED_MACHINE"
          if "$readelf" -d "$library" | grep -F "libc++_shared.so"; then
            echo "ELF unexpectedly depends on libc++_shared.so" >&2
            exit 1
          fi

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: build/android/${{ matrix.abi }}/wrapper/wrapper/libvalhalla-wrapper.so
          if-no-files-found: error

  aar:
    name: AAR contents
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android compile tools
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/commandlinetools.zip"
          sdk_root="${RUNNER_TEMP}/android-sdk"
          curl --fail --location --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CLI_VERSION}_latest.zip" \
            --output "$archive"
          echo "${ANDROID_CLI_CHECKSUM}  ${archive}" | sha256sum --check
          mkdir -p "${sdk_root}/cmdline-tools"
          unzip -q "$archive" -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          echo "ANDROID_HOME=${sdk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "$GITHUB_ENV"
          echo "${sdk_root}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-36" >/dev/null

      - name: Download arm64-v8a library
        uses: actions/download-artifact@v4
        with:
          name: native-arm64-v8a
          path: build/android/arm64-v8a/wrapper/wrapper

      - name: Download x86_64 library
        uses: actions/download-artifact@v4
        with:
          name: native-x86_64
          path: build/android/x86_64/wrapper/wrapper

      - name: Assemble combined release AAR
        run: |
          ./android/gradlew \
            -p android \
            :valhalla:assembleRelease \
            -PvalhallaUsePrebuiltNative=true \
            --no-daemon \
            --warning-mode=fail

      - name: Inspect AAR
        shell: bash
        run: |
          aar="android/valhalla/build/outputs/aar/valhalla-release.aar"
          entries="$(unzip -Z1 "$aar" | grep -E '^jni/.+\.so$' | sort)"
          test "$entries" = "$(printf '%s\n' \
            'jni/arm64-v8a/libvalhalla-wrapper.so' \
            'jni/x86_64/libvalhalla-wrapper.so')"
          unzip -p "$aar" proguard.txt \
            | grep -F -- '-keep class com.valhalla.valhalla.ValhallaKotlin'
          unzip -p "$aar" proguard.txt | grep -F -- 'native <methods>;'

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-release-aar
          path: android/valhalla/build/outputs/aar/valhalla-release.aar
          if-no-files-found: error

  emulator:
    name: x86_64 Emulator route
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android compile tools
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/commandlinetools.zip"
          sdk_root="${RUNNER_TEMP}/android-sdk"
          curl --fail --location --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CLI_VERSION}_latest.zip" \
            --output "$archive"
          echo "${ANDROID_CLI_CHECKSUM}  ${archive}" | sha256sum --check
          mkdir -p "${sdk_root}/cmdline-tools"
          unzip -q "$archive" -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          echo "ANDROID_HOME=${sdk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "$GITHUB_ENV"
          echo "${sdk_root}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;35.0.0" \
            "platforms;android-36" >/dev/null

      - name: Download x86_64 library
        uses: actions/download-artifact@v4
        with:
          name: native-x86_64
          path: build/android/x86_64/wrapper/wrapper

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Load native library and route fixture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 600
          disable-animations: true
          script: >-
            ./android/gradlew -p android
            :valhalla:connectedDebugAndroidTest
            -PvalhallaAbis=x86_64
            -PvalhallaUsePrebuiltNative=true
            --no-daemon
            --warning-mode=fail

  ios-non-regression:
    name: iOS non-regression guard
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reject Apple, release, shared JNI, or submodule changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git diff --exit-code "$BASE_SHA"...HEAD -- \
            Package.swift \
            apple \
            src/wrapper \
            .github/workflows/release.yml \
            scripts/build_apple.sh \
            scripts/create_xcframework.sh \
            scripts/write_xcframework_spm.sh \
            version.txt \
            src/valhalla
          test "$(git rev-parse HEAD:src/valhalla)" = "13eb61624f9b6464dbaad5081e9fd71207ec539c"
          swift package dump-package >/dev/null
